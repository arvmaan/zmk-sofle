---
# Every push builds BOTH the stock nice_view firmware and the custom-art one.
# If a custom build ever misbehaves, flash the matching "nice_view" .uf2 to get back
# to known-good stock behaviour. No bootloader recovery needed.
include:
  # --- stock nice!view (fallback, always known-good) ---
  - board: nice_nano_v2
    shield: eyelash_sofle_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: nice_nano_v2
    shield: eyelash_sofle_right nice_view

  # --- custom art (boards/shields/nice_view_custom) ---
  - board: nice_nano_v2
    shield: eyelash_sofle_left nice_view_custom
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: nice_nano_v2
    shield: eyelash_sofle_right nice_view_custom

  # --- wipes BLE bonds + split pairing ---
  - board: nice_nano_v2
    shield: settings_reset
